<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rummy Count - Ray-Ban Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 600px;
            height: 600px;
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #viewport {
            width: 600px;
            height: 600px;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            padding: 8px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.1);
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 4px;
            font-size: 9px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo {
            background: #00ff00;
            color: #0a0a0a;
            padding: 2px 4px;
            font-weight: bold;
            font-size: 8px;
            min-width: 24px;
            text-align: center;
        }

        .header-title {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 8px;
        }

        .status-dot {
            width: 4px;
            height: 4px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* TOP STATS */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .stat-box {
            border: 1px solid #00ff00;
            padding: 4px;
            background: #0a1a0a;
            text-align: center;
            font-size: 8px;
        }

        .stat-label {
            font-size: 7px;
            color: #00aa00;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
        }

        .stat-subtext {
            font-size: 7px;
            color: #00aa00;
            margin-top: 1px;
        }

        /* MODE TABS */
        .mode-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 3px 6px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .tab-btn:focus {
            background: #00ff00;
            color: #0a0a0a;
            outline: none;
        }

        .tab-btn.active {
            background: #00ff00;
            color: #0a0a0a;
        }

        .reset-btn {
            padding: 3px 6px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
        }

        .reset-btn:focus {
            background: #ff6600;
            border-color: #ff6600;
            color: #0a0a0a;
            outline: none;
        }

        /* MAIN CONTENT */
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel {
            border: 1px solid #00ff00;
            background: #0a1a0a;
            padding: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 8px;
        }

        .panel-title {
            font-size: 7px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 2px;
            flex-shrink: 0;
        }

        /* CARD MATRIX */
        .card-matrix {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 2px;
            flex: 1;
            overflow: hidden;
        }

        .card-cell {
            border: 1px solid #00ff00;
            background: #0a1a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 6px;
            font-weight: bold;
            min-height: 20px;
            position: relative;
            padding: 1px;
        }

        .card-cell:focus {
            background: #00ff00;
            color: #0a0a0a;
            outline: none;
            z-index: 10;
        }

        .card-cell.discarded {
            background: #2a0a0a;
            border-color: #ff6600;
            opacity: 0.6;
        }

        .card-cell.held {
            background: #0a2a0a;
            border-color: #00ff00;
            box-shadow: 0 0 4px rgba(0, 255, 0, 0.5);
        }

        .card-rank {
            font-size: 7px;
            font-weight: bold;
            line-height: 1;
        }

        .card-suit {
            font-size: 8px;
            line-height: 1;
        }

        .matrix-legend {
            display: flex;
            gap: 6px;
            font-size: 6px;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid #00ff00;
            flex-shrink: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .legend-box {
            width: 8px;
            height: 8px;
            border: 1px solid #00ff00;
        }

        .legend-box.d {
            background: #2a0a0a;
        }

        .legend-box.h {
            background: #0a2a0a;
        }

        /* ACTION PANEL */
        .action-box {
            border: 1px solid #00ff00;
            padding: 4px;
            margin-bottom: 4px;
            background: #0a1a0a;
            font-size: 7px;
        }

        .action-title {
            font-size: 7px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            color: #00ff00;
        }

        .action-content {
            font-size: 7px;
            line-height: 1.2;
            color: #00ff00;
        }

        .rec-good {
            color: #00ff00;
        }

        .rec-bad {
            color: #ff6600;
        }

        .probability {
            font-size: 6px;
            color: #00aa00;
            margin-top: 1px;
        }

        .action-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* HAND MODE */
        .hand-input-area {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .hand-input {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 2px;
            font-family: 'Courier New', monospace;
            font-size: 7px;
            width: 100%;
        }

        .hand-input:focus {
            background: #00ff00;
            color: #0a0a0a;
            outline: none;
        }

        .hand-input::placeholder {
            color: #00aa00;
        }

        .input-btn {
            padding: 3px 4px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 7px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            width: 100%;
        }

        .input-btn:focus {
            background: #00ff00;
            color: #0a0a0a;
            outline: none;
        }

        .hand-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 2px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff00;
        }

        /* FOOTER */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid #00ff00;
            font-size: 7px;
            color: #00aa00;
            flex-shrink: 0;
        }

        .pool-status {
            font-weight: bold;
            color: #00ff00;
        }

        /* HIDDEN */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="viewport">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo">RC</div>
                <div class="header-title">RUMMY / 01</div>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>LIVE</span>
            </div>
        </div>

        <!-- STATS ROW -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">DECKS</div>
                <div id="deckDisplay" class="stat-value">1</div>
                <div class="stat-subtext">/ 10</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">POOL</div>
                <div id="poolCount" class="stat-value">52</div>
                <div class="stat-subtext">cards</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">KNOWN</div>
                <div id="knownCount" class="stat-value">0</div>
                <div class="stat-subtext">disc</div>
            </div>
        </div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
            <button class="tab-btn active" id="tab01" tabindex="0">CARDS</button>
            <button class="tab-btn" id="tab02" tabindex="0">HAND</button>
            <button class="reset-btn" id="resetBtn" tabindex="0">RST</button>
        </div>

        <!-- CONTENT AREA -->
        <div class="content">
            <!-- LEFT: CARD MATRIX -->
            <div id="matrixPanel" class="panel">
                <div class="panel-title">CARD MATRIX</div>
                <div id="cardMatrix" class="card-matrix"></div>
                <div class="matrix-legend">
                    <div class="legend-item">
                        <div class="legend-box d"></div>
                        <span>D</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box h"></div>
                        <span>H</span>
                    </div>
                </div>
            </div>

            <!-- RIGHT: ACTION & ANALYSIS -->
            <div id="actionPanel" class="panel">
                <div class="panel-title">ACTION</div>
                <div class="action-scroll" id="actionContent"></div>
            </div>
        </div>

        <!-- HAND MODE PANEL -->
        <div id="handPanel" class="panel hidden" style="flex: 1;">
            <div class="panel-title">MY HAND</div>
            <div class="hand-input-area">
                <input type="text" id="handInput" class="hand-input" placeholder="AS,2H,3D" tabindex="0">
                <button class="input-btn" id="analyzeBtn" tabindex="0">ANALYZE</button>
            </div>
            <div class="hand-scroll" id="handAnalysisContent"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span>POOL <span class="pool-status" id="poolPercent">100%</span></span>
            <span>↑↓ DECK | TAB CARD | ENTER ACTION</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
